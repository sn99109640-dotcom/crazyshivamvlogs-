
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRAZYSHIVAMVLOGS ❤️ GAME</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;overflow:hidden;background:#050005;
  color:white;font-family:Arial,sans-serif
}

#intro{
  position:fixed;inset:0;
  background:radial-gradient(circle,#62005f,#090009 65%);
  display:flex;align-items:center;justify-content:center;
  z-index:100;animation:introFade 3s forwards;
  pointer-events:none
}

#introName{
  text-align:center;font-size:clamp(28px,9vw,75px);
  font-weight:900;letter-spacing:3px;
  background:linear-gradient(90deg,red,magenta,cyan,lime,yellow,red);
  background-size:400%;
  -webkit-background-clip:text;background-clip:text;
  color:transparent;
  animation:nameZoom 2s ease,rainbow 2s linear infinite;
  filter:drop-shadow(0 0 10px magenta) drop-shadow(0 0 30px cyan)
}

@keyframes nameZoom{
  0%{transform:scale(0);opacity:0}
  60%{transform:scale(1.15)}
  100%{transform:scale(1);opacity:1}
}
@keyframes rainbow{0%{background-position:0%}100%{background-position:400%}}
@keyframes introFade{
  0%,75%{opacity:1;visibility:visible}
  100%{opacity:0;visibility:hidden}
}

#game{
  width:100vw;height:100vh;height:100dvh;
  position:relative;overflow:hidden;isolation:isolate;
  background:radial-gradient(circle at 50% 50%,#42003f,#100010 45%,#030003)
}

.glow{
  position:absolute;width:260px;height:260px;border-radius:50%;
  background:#ff00cc;filter:blur(85px);opacity:.3;
  pointer-events:none;z-index:0;
  animation:floatGlow 7s ease-in-out infinite alternate
}
.glow.one{left:-100px;top:15%}
.glow.two{right:-100px;bottom:10%;background:#00ffff;animation-delay:-3s}
.glow.three{left:35%;top:40%;width:180px;height:180px;background:#8a2bff;animation-duration:9s}

@keyframes floatGlow{
  0%{transform:translate(0,0) scale(.8)}
  50%{transform:translate(70px,50px) scale(1.2)}
  100%{transform:translate(-25px,-60px) scale(1)}
}

#particles{
  position:absolute;inset:0;overflow:hidden;
  pointer-events:none;z-index:1
}

.particle{
  position:absolute;bottom:-30px;color:#ff55ee;opacity:0;
  text-shadow:0 0 12px currentColor;
  animation:rise linear infinite
}

@keyframes rise{
  0%{transform:translateY(0) rotate(0deg) scale(.6);opacity:0}
  10%{opacity:.8}
  80%{opacity:.6}
  100%{transform:translateY(-115vh) rotate(360deg) scale(1.3);opacity:0}
}

.lightStreak{
  position:absolute;width:160px;height:2px;
  background:linear-gradient(90deg,transparent,#00ffff,transparent);
  opacity:0;pointer-events:none;
  animation:streakMove 6s linear infinite;z-index:1
}
.lightStreak:nth-of-type(2){animation-delay:-2s}
.lightStreak:nth-of-type(3){animation-delay:-4s;background:linear-gradient(90deg,transparent,#ff00cc,transparent)}

@keyframes streakMove{
  0%{left:-180px;top:25%;opacity:0}
  10%{opacity:.8}
  90%{opacity:.5}
  100%{left:110%;top:75%;opacity:0}
}

#topPanel{
  position:absolute;top:12px;left:50%;transform:translateX(-50%);
  width:94%;max-width:600px;display:grid;
  grid-template-columns:1fr 1fr;gap:8px;z-index:10
}

.info{
  padding:10px;border-radius:15px;text-align:center;
  font-size:16px;font-weight:bold;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.18);
  box-shadow:0 0 15px rgba(255,0,255,.2);
  backdrop-filter:blur(10px)
}

#level{color:#00ffff}
#score{color:#ff66dd}
#target{color:#ffff00}
#time{color:#00ff88}

#progressBox{
  position:absolute;top:105px;left:50%;transform:translateX(-50%);
  width:90%;max-width:500px;height:13px;
  background:#1b001b;border-radius:20px;overflow:hidden;
  border:1px solid #ff00cc;z-index:10
}

#progress{
  height:100%;width:0%;
  background:linear-gradient(90deg,#ff00cc,#ff1493,#00ffff);
  box-shadow:0 0 15px #ff00cc;transition:width .2s
}

#heart{
  position:absolute;width:90px;height:90px;border:none;padding:0;
  background:transparent;font-size:75px;cursor:pointer;
  user-select:none;touch-action:manipulation;z-index:5;
  transition:left .12s ease,top .12s ease;
  animation:beat .55s infinite alternate;
  filter:drop-shadow(0 0 8px #ff0066) drop-shadow(0 0 25px #ff00ff)
}

@keyframes beat{
  from{transform:scale(1)}
  to{transform:scale(1.22)}
}

.tapEffect{
  position:absolute;pointer-events:none;font-size:30px;
  animation:tapPop .6s forwards;z-index:20;color:#fff;
  text-shadow:0 0 15px #ff00cc
}

@keyframes tapPop{
  0%{transform:scale(.5);opacity:1}
  100%{transform:translate(var(--moveX),-80px) scale(1.5);opacity:0}
}

/* LEVEL-UP CELEBRATION */
#levelComplete{
  position:absolute;inset:0;display:none;
  align-items:center;justify-content:center;
  background:rgba(0,0,0,.82);backdrop-filter:blur(7px);
  z-index:50;text-align:center;overflow:hidden
}

#levelComplete.levelFlash{animation:levelFlash .7s ease}

#levelEmoji{
  font-size:clamp(65px,18vw,100px);line-height:1.2;
  filter:drop-shadow(0 0 20px var(--levelColor,#00ffff));
  animation:emojiEntrance .8s cubic-bezier(.2,1.8,.4,1) both
}

#levelCompleteBox{
  position:relative;z-index:2;padding:30px;width:90%;
  max-width:400px;border-radius:25px;
  background:linear-gradient(135deg,#280025,#090009);
  border:2px solid var(--levelColor,#ff00cc);
  box-shadow:0 0 30px var(--levelColor,#ff00cc);
  animation:pop .5s ease
}

#levelComplete h1{
  color:var(--levelColor,#00ffcc);
  font-size:clamp(30px,8vw,42px);margin:0 0 10px
}

#levelComplete p{font-size:20px;line-height:1.5}

.levelConfetti{
  position:absolute;left:50%;top:50%;font-size:25px;
  pointer-events:none;animation:confettiFly 1.25s ease-out forwards;
  text-shadow:0 0 12px currentColor
}

@keyframes levelFlash{
  0%{background:rgba(255,255,255,.9)}
  35%{background:rgba(120,0,255,.65)}
  100%{background:rgba(0,0,0,.82)}
}

@keyframes emojiEntrance{
  0%{transform:scale(0) rotate(-180deg);opacity:0}
  65%{transform:scale(1.25) rotate(15deg);opacity:1}
  100%{transform:scale(1) rotate(0)}
}

@keyframes confettiFly{
  0%{transform:translate(-50%,-50%) rotate(0) scale(.2);opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) rotate(720deg) scale(1.4);opacity:0}
}

@keyframes pop{
  from{transform:scale(.5);opacity:0}
  to{transform:scale(1);opacity:1}
}

/* GAME OVER */
#gameOver{
  position:absolute;inset:0;display:none;
  align-items:center;justify-content:center;
  background:rgba(0,0,0,.92);backdrop-filter:blur(8px);
  z-index:60;text-align:center
}

#gameOverBox{
  padding:30px;width:90%;max-width:400px;
  border-radius:25px;background:#120012;
  border:2px solid #ff1493;box-shadow:0 0 35px #ff1493
}

#gameOver h1{color:#ff1493;font-size:clamp(30px,8vw,42px)}
#finalScore{font-size:23px}
#finalLevel{font-size:20px}

#restart{
  margin-top:15px;padding:14px 28px;border:none;
  border-radius:30px;font-size:18px;font-weight:bold;
  color:white;background:linear-gradient(90deg,#ff0080,#8000ff);
  box-shadow:0 0 20px #ff00cc;cursor:pointer
}

#brand{
  margin-top:20px;color:#00ffff;font-weight:bold;
  text-shadow:0 0 12px #00ffff
}

/* YOUTUBE SUBSCRIBE */
#subscribeBanner{
  position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
  width:94%;max-width:420px;padding:11px 8px;text-align:center;
  border:1px solid #ff1744;border-radius:16px;
  background:rgba(30,0,10,.88);box-shadow:0 0 18px #ff1744;z-index:15
}

#subscribeBanner a{
  color:white;text-decoration:none;
  font-size:clamp(12px,3.7vw,16px);font-weight:bold;
  line-height:1.5;text-shadow:0 0 10px #ff1744;
  animation:subscribeGlow 1s infinite alternate
}

@keyframes subscribeGlow{
  from{text-shadow:0 0 5px #ff1744}
  to{text-shadow:0 0 15px #ff1744,0 0 25px #ff1744}
}

@media(max-height:620px){
  #topPanel{top:7px}
  .info{padding:7px;font-size:14px}
  #progressBox{top:90px}
  #subscribeBanner{bottom:5px;padding:7px}
}
</style>
</head>

<body>

<div id="intro">
  <div id="introName">CRAZYSHIVAMVLOGS ❤️</div>
</div>

<div id="game">
  <div class="glow one"></div>
  <div class="glow two"></div>
  <div class="glow three"></div>

  <div id="particles"></div>
  <div class="lightStreak"></div>
  <div class="lightStreak"></div>
  <div class="lightStreak"></div>

  <div id="topPanel">
    <div class="info" id="level">🏆 LEVEL: 1</div>
    <div class="info" id="score">❤️ TAP: 0</div>
    <div class="info" id="target">🎯 TARGET: 40</div>
    <div class="info" id="time">⏱️ TIME: 30</div>
  </div>

  <div id="progressBox"><div id="progress"></div></div>

  <button id="heart" aria-label="Tap heart">❤️</button>

  <div id="levelComplete">
    <div id="levelCompleteBox">
      <div id="levelEmoji">🚀</div>
      <h1 id="levelHeading">LEVEL UP!</h1>
      <p id="levelMessage">Amazing! 🔥</p>
    </div>
  </div>

  <div id="gameOver">
    <div id="gameOverBox">
      <h1>GAME OVER 💔</h1>
      <p id="finalScore">Score: 0</p>
      <p id="finalLevel">Level: 1</p>
      <button id="restart">🔄 PLAY AGAIN</button>
      <div id="brand">CRAZYSHIVAMVLOGS 🔥</div>
    </div>
  </div>

  <div id="subscribeBanner">
    <a href="https://www.youtube.com/@crazyshivamvlogs"
       target="_blank" rel="noopener noreferrer">
      🔴 SUBSCRIBE ON YOUTUBE<br>@crazyshivamvlogs ❤️
    </a>
  </div>
</div>

<script>
let level=1,taps=0,totalScore=0,target=40,time=30;
let timer=null,gameRunning=true,levelTransition=false;

const levelEmoji=document.getElementById("levelEmoji");
const levelHeading=document.getElementById("levelHeading");
const heart=document.getElementById("heart");
const levelText=document.getElementById("level");
const scoreText=document.getElementById("score");
const targetText=document.getElementById("target");
const timeText=document.getElementById("time");
const progress=document.getElementById("progress");
const levelComplete=document.getElementById("levelComplete");
const levelMessage=document.getElementById("levelMessage");
const gameOver=document.getElementById("gameOver");
const finalScore=document.getElementById("finalScore");
const finalLevel=document.getElementById("finalLevel");
const restart=document.getElementById("restart");

function createParticles(){
  const container=document.getElementById("particles");
  const symbols=["✦","✧","•","♡","✶","⋆"];
  const colors=["#ff00cc","#00ffff","#ff1493","#a855f7","#ffffff"];

  for(let i=0;i<32;i++){
    const p=document.createElement("span");
    p.className="particle";
    p.textContent=symbols[Math.floor(Math.random()*symbols.length)];
    p.style.left=Math.random()*100+"%";
    p.style.fontSize=10+Math.random()*18+"px";
    p.style.color=colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDuration=5+Math.random()*10+"s";
    p.style.animationDelay=-Math.random()*12+"s";
    container.appendChild(p);
  }
}

function moveHeart(){
  const margin=15,topSpace=135,heartSize=90;
  const maxX=window.innerWidth-heartSize-margin;
  const maxY=window.innerHeight-heartSize-margin;
  const x=margin+Math.random()*Math.max(1,maxX-margin);
  const y=topSpace+Math.random()*Math.max(1,maxY-topSpace);

  heart.style.left=x+"px";
  heart.style.top=y+"px";
}

function updateUI(){
  levelText.innerText="🏆 LEVEL: "+level;
  scoreText.innerText="❤️ TAP: "+taps;
  targetText.innerText="🎯 TARGET: "+target;
  timeText.innerText="⏱️ TIME: "+time;
  progress.style.width=Math.min(100,(taps/target)*100)+"%";
}

function createEffect(){
  const e=document.createElement("div");
  e.className="tapEffect";
  e.innerText="+1 ❤️";
  e.style.left=heart.offsetLeft+35+"px";
  e.style.top=heart.offsetTop+"px";
  e.style.setProperty("--moveX",Math.random()*100-50+"px");

  document.getElementById("game").appendChild(e);
  setTimeout(()=>e.remove(),600);
}

function startTimer(){
  clearInterval(timer);

  timer=setInterval(()=>{
    if(!gameRunning)return;

    time--;
    updateUI();

    if(time<=0){
      clearInterval(timer);
      endGame();
    }
  },1000);
}

/* Har level par alag emoji, color aur celebration */
function showLevelCelebration(){
  const celebrations=[
    {emoji:"🚀",title:"ROCKET BLAST!",color:"#00ffff",message:"Blast off! Next level unlocked!"},
    {emoji:"👑",title:"ROYAL LEVEL!",color:"#ffd700",message:"King move! Keep tapping!"},
    {emoji:"🦄",title:"MAGIC LEVEL!",color:"#ff66ff",message:"Unicorn magic activated!"},
    {emoji:"🔥",title:"ON FIRE!",color:"#ff6b00",message:"You're on fire! Don't stop!"},
    {emoji:"💎",title:"DIAMOND POWER!",color:"#00e5ff",message:"Shining bright! Level unlocked!"},
    {emoji:"⚡",title:"SUPER POWER!",color:"#ffff00",message:"Lightning speed! Keep going!"},
    {emoji:"🐉",title:"DRAGON MODE!",color:"#65ff65",message:"Legendary power unlocked!"},
    {emoji:"🛸",title:"SPACE MODE!",color:"#a78bfa",message:"Welcome to another galaxy!"},
    {emoji:"🏆",title:"CHAMPION!",color:"#ffcc00",message:"You're becoming a legend!"},
    {emoji:"🌈",title:"RAINBOW MODE!",color:"#ff66cc",message:"A colorful new level awaits!"}
  ];

  const c=celebrations[(level-2)%celebrations.length];

  levelEmoji.innerText=c.emoji;
  levelHeading.innerText=c.title;
  levelMessage.innerText=c.message+" 🎯 Target: "+target+" taps!";

  levelComplete.style.setProperty("--levelColor",c.color);
  levelComplete.classList.remove("levelFlash");
  void levelComplete.offsetWidth;
  levelComplete.classList.add("levelFlash");

  levelComplete.querySelectorAll(".levelConfetti").forEach(e=>e.remove());

  const bits=[c.emoji,"✨","⭐","🎉","💫","🎊"];

  for(let i=0;i<34;i++){
    const bit=document.createElement("span");
    bit.className="levelConfetti";
    bit.textContent=bits[Math.floor(Math.random()*bits.length)];
    bit.style.color=[c.color,"#ff00cc","#ffffff","#ffff00"][Math.floor(Math.random()*4)];

    bit.style.setProperty(
      "--dx",(Math.random()*window.innerWidth-window.innerWidth/2)+"px"
    );

    bit.style.setProperty(
      "--dy",(Math.random()*window.innerHeight-window.innerHeight/2)+"px"
    );

    bit.style.animationDelay=(Math.random()*.18)+"s";
    levelComplete.appendChild(bit);
    setTimeout(()=>bit.remove(),1500);
  }
}

function nextLevel(){
  if(!gameRunning||levelTransition)return;

  gameRunning=false;
  levelTransition=true;
  clearInterval(timer);

  level++;
  target=40+(level-1)*10;
  time=30+(level-1)*5;
  taps=0;

  showLevelCelebration();
  levelComplete.style.display="flex";
  updateUI();

  setTimeout(()=>{
    if(!levelTransition)return;

    levelComplete.style.display="none";
    levelTransition=false;
    gameRunning=true;
    moveHeart();
    startTimer();
  },1800);
}

heart.addEventListener("click",()=>{
  if(!gameRunning||levelTransition)return;

  taps++;
  totalScore++;

  createEffect();
  updateUI();
  moveHeart();

  if(taps>=target)nextLevel();
});

function endGame(){
  gameRunning=false;
  levelTransition=false;
  clearInterval(timer);

  heart.style.display="none";
  levelComplete.style.display="none";

  finalScore.innerText="❤️ Total Taps: "+totalScore;
  finalLevel.innerText="🏆 Reached Level: "+level;
  gameOver.style.display="flex";
}

restart.addEventListener("click",()=>{
  clearInterval(timer);

  level=1;
  taps=0;
  totalScore=0;
  target=40;
  time=30;
  gameRunning=true;
  levelTransition=false;

  heart.style.display="block";
  gameOver.style.display="none";
  levelComplete.style.display="none";

  updateUI();
  moveHeart();
  startTimer();
});

createParticles();
updateUI();
moveHeart();
startTimer();

window.addEventListener("resize",moveHeart);
</script>

</body>
        </html>
